# fly.toml app configuration file generated for postready-handling by `flyctl launch` on 2024-11-01T10:00:00Z
app = "postready-handling"
primary_region = "ord"

[build]
  [build.args]
    NODE_VERSION = "24"

[env]
  PORT = "3000"
  DEPLOYMENT_URL = "https://postready-handling.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "5gb"

[checks]
  [checks.status]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
