# fly.toml app configuration file generated for postready-handling on 2026-01-07T08:46:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'postready-handling'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[[mounts]]
  source = 'secrets'
  destination = '/run/secrets'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  PORT = "3000"
  DEPLOYMENT_URL = "https://postready-handling.fly.dev"
  NODE_ENV = "production"
